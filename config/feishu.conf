# Relay 飞书 Project 配置。本机差异和密钥写 feishu.local.conf，同名键以 local 为准。
# 修改 Project 连接后重启 Relay 后端。群机器人在管理员的「飞书管理」页配置。
# 配置格式版本，当前固定为 1。
CONFIG_VERSION=1

# 飞书 Project 只读连接。以下身份项全部留空表示未配置。
# 连接别名，供工作台 FEISHU_CONNECTION_ID 引用。
CONNECTION_ID=
# 飞书 Project 空间标识。
PROJECT_KEY=
# 查询责任事项所使用的飞书用户标识。
USER_KEY=
# Project 插件标识及密钥；密钥仅写入本机 local 文件。
PLUGIN_ID=
PLUGIN_SECRET=
