# 飞书 Project 只读连接；本机差异写 feishu.local.conf，同名键以 local 为准。
# 身份项全部留空表示未配置；启用后须填齐，修改后重启 Relay 后端。
# 配置格式版本，当前固定为 1。
CONFIG_VERSION=1
# 连接别名，供工作台 FEISHU_CONNECTION_ID 引用。
CONNECTION_ID=
# 飞书 Project 空间标识。
PROJECT_KEY=
# 查询责任事项所使用的飞书用户标识。
USER_KEY=
# Project 插件标识及密钥；密钥仅写入本机 local 文件。
PLUGIN_ID=
PLUGIN_SECRET=
