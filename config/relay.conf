# Relay 统一非敏感部署配置。
# Codex app-server 仅允许绑定本机回环 IP，避免直接暴露到局域网或公网。
CODEX_HOST=127.0.0.1
CODEX_PORT=9281

# Relay 后端监听端点。通配地址用于接受局域网连接，内部探活与代理会自动改用回环地址。
BACKEND_LISTEN_HOST=0.0.0.0
BACKEND_LISTEN_PORT=9181

# 浏览器入口监听端点，production 网关与 development Vite 共用。
FRONTEND_LISTEN_HOST=0.0.0.0
FRONTEND_LISTEN_PORT=9081

# 留空表示不允许公网地址；多个地址使用英文逗号分隔。
# 0.0.0.0 表示允许任意公网地址，不推荐。
PUBLIC_ALLOWED_ADDRESSES=

# 仅信任这些直接连接前端的代理IP，并且Host必须精确匹配上述公网地址。
# 代理必须在X-Forwarded-For尾部追加实际访问者IP；直连部署请留空。
TRUSTED_PROXY_IPS=
