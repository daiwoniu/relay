# 任务工作台配置；本机差异写 workbench.local.conf，同名键以 local 为准。
# 省略键表示继承，显式 KEY= 表示清空；修改后重启 Relay 后端。
# 配置格式版本，当前固定为 1。
CONFIG_VERSION=1
# 稳定工作区标识；同一业务仓库移动目录时可保留，切换仓库应更换。
WORKSPACE_ID=default
# 当前电脑上的业务仓库绝对目录；留空只关闭本地台账，不影响聊天和飞书。
WORKSPACE_ROOT=
# 首期台账格式适配器，当前只支持 task-registry-v1。
ADAPTER=task-registry-v1
# 可选：关联飞书连接别名，非空时须与 feishu 配置的 CONNECTION_ID 一致。
FEISHU_CONNECTION_ID=
# 可选：业务仓库的版本字段、申请类型和原生关系键；不填时不做相应补查。
# ADAPTER_VERSION_FIELD=规划版本
# ADAPTER_APPLICATION_TYPE=
# ADAPTER_RELATION_KEY=
# 以下字段可填写 API 字段键或元数据中的字段名称；不填则不补充业务发布信息。
# ADAPTER_CANARY_VERSION_FIELD=金丝雀规划版本
# ADAPTER_CANARY_FLAG_FIELD=是否金丝雀发布
# ADAPTER_STORY_RELATION_FIELD=关联需求
# ADAPTER_STORY_TYPE=story
# ADAPTER_VERSION_TYPE=version
# ADAPTER_RELEASE_NODE_NAME=金丝雀发布
# ADAPTER_APPLICATION_STORY_FIELD=关联需求
